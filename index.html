function switchTZ(v){tz=v;renderMatches();}
function switchTheme(){const cur=document.documentElement.getAttribute('data-theme');const n=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);document.getElementById('thBtn').textContent=n==='dark'?'☀️':'🌙';localStorage.setItem('wc2026_theme_m',n);}

function buildCard(m,isKO){
  const[mn,date,bj,local,t1,t2,g,rnd,skey]=m;
  const s=S(skey);
  const isOpener=(mn==='M1'),isFinal=(rnd==='决赛');
  let cls='mc';if(isFinal)cls+=' final';else if(isOpener)cls+=' opener';else if(m.length>9&&m[9])cls+=' hl';
  const rl=isKO?rnd:`${g}组 · ${rnd}`;
  const gCls=isKO?'g-KO':'g-'+g;
  const time=tz==='bj'?bj:local;
  const res=GR(mn);
  const scoreHTML=res?`<div class="score">${res.t1s} - ${res.t2s}</div>`:'';
  return `<div class="${cls}${res?' has-result':''}" data-search="${mn} ${t1} ${t2} ${g} ${rnd} ${s.city} ${s.name} ${date}" data-gr="${g}" data-rnd="${rnd}" data-m='${JSON.stringify(m).replace(/'/g,"&#39;")}' data-isko="${isKO}" onclick="toggleD(this)">
    <div class="mt"><span class="gn">${mn}</span><span class="gb ${gCls}">${rl}</span><span class="gn">${date}</span></div>
    <div class="tm">${t1} <span class="vs">VS</span> ${t2}</div>${scoreHTML}
    <div class="mi"><span>🕐${time}</span><span>🏟️${s.name}</span><span>👥${s.cap}</span></div>
    <div class="dt" id="dt-${mn}"></div>
  </div>`;
}
function toggleD(el){
  const was=el.classList.contains('exp');
  document.querySelectorAll('.mc.exp').forEach(c=>c.classList.remove('exp'));
  if(!was){el.classList.add('exp');const dt=el.querySelector('.dt');if(dt&&!dt.dataset.loaded){const m=JSON.parse(el.getAttribute('data-m'));const isKO=el.getAttribute('data-isko')==='true';dt.innerHTML=buildDetail(m,isKO);dt.dataset.loaded='1';}}
}
function buildDetail(m,isKO){
  const[mn,date,bj,local,t1,t2,g,rnd,skey]=m;
  const s=S(skey);
  const k1=tk(t1),k2=tk(t2);
  function fr(tn){for(const key of Object.keys(P)){if(key===tn||key.includes(tn)||tn.includes(key))return P[key];}return[];}
  function rs(label,roster){
    if(!roster||!roster.length)return`<div><h5>${label}</h5><p style="font-size:.65rem;color:var(--m)">暂无数据</p></div>`;
    let rows=roster.map(p=>{const[nm,pos,club,num,isCap]=p;return`<div class="rr${isCap?' cap':''}"><span class="rn">${num}</span><span class="rna">${nm}${isCap?' ⭐':''}</span><span class="rp">${pos}</span><span style="font-size:.6rem;color:var(--m)">${club}</span></div>`;}).join('');
    return`<div><h5>${label}</h5>${rows}</div>`;
  }
  const r1=fr(k1),r2=fr(k2);
  const res=GR(mn);
  const resultHTML=res?`<div style="text-align:center;font-size:1.4rem;font-weight:800;color:var(--a);margin:8px 0">${res.t1s} - ${res.t2s}${res.notes?' <span style="font-size:.65rem;color:var(--m)">('+res.notes+')</span>':''}</div>`:'';
  const editHTML=`<div class="re"><input type="number" id="rs1_${mn}" placeholder="?" style="width:36px"><span>-</span><input type="number" id="rs2_${mn}" placeholder="?" style="width:36px"><input type="text" id="rsn_${mn}" placeholder="备注" style="width:60px"><button onclick="saveResult('${mn}')">💾</button></div>`;
  const r1k=RANKINGS[k1]||'-',r2k=RANKINGS[k2]||'-';
  return `${resultHTML}
    <div class="ds"><h4>📋 配置</h4><div class="dg"><span>🇨🇳${date} ${bj}</span><span>📍${local||''}</span><span>🏟️${s.name}</span><span>🏙️${s.city}</span><span>🕐${s.tz}</span><span>👥${s.cap}</span><span>🌿${s.surf}</span><span>🏗️${s.roof}</span><span>📊#${r1k}</span><span>📊#${r2k}</span></div></div>
    <div class="ds"><h4>👥 球员</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${rs(t1,r1)}${rs(t2,r2)}</div></div>${editHTML}`;
}
function saveResult(mn){const s1=parseInt(document.getElementById('rs1_'+mn)?.value);const s2=parseInt(document.getElementById('rs2_'+mn)?.value);if(isNaN(s1)||isNaN(s2))return;const notes=document.getElementById('rsn_'+mn)?.value||'';RESULTS[mn]={t1s:s1,t2s:s2,notes};localStorage.setItem('wc2026_results_m',JSON.stringify(RESULTS));renderTab();}

function renderMatches(){
  const stages=['第1轮','第2轮','第3轮','1/16决赛','1/8决赛','1/4决赛','半决赛','三四名决赛','决赛'];
  const all=[...GM.map(m=>[m,false]),...KO.map(m=>[m,true])];
  let html='';
  stages.forEach(st=>{const ms=all.filter(([m,ko])=>m[ko?5:7]===st);if(!ms.length)return;html+=`<div class="rh">${st}（${ms.length}场）</div>`;ms.forEach(([m,ko])=>html+=buildCard(m,ko));});
  document.getElementById('content').innerHTML=html;AF();
}
function renderStandings(){
  const groups={};'ABCDEFGHIJKL'.split('').forEach(g=>{groups[g]=[];});
  GM.forEach(m=>{const g=m[6],t1=tk(m[4]),t2=tk(m[5]);if(!groups[g])return;if(!groups[g].find(t=>t.name===t1))groups[g].push({name:t1,flag:m[4]});if(!groups[g].find(t=>t.name===t2))groups[g].push({name:t2,flag:m[5]});});
  const pts={};
  Object.entries(RESULTS).forEach(([mn,res])=>{const m=[...GM,...KO].find(x=>x[0]===mn);if(!m||(m[7]&&m[7].includes('决赛')))return;const t1=tk(m[4]),t2=tk(m[5]);if(!pts[t1])pts[t1]={p:0,gf:0,ga:0};if(!pts[t2])pts[t2]={p:0,gf:0,ga:0};pts[t1].gf+=res.t1s;pts[t1].ga+=res.t2s;pts[t2].gf+=res.t2s;pts[t2].ga+=res.t1s;if(res.t1s>res.t2s)pts[t1].p+=3;else if(res.t1s<res.t2s)pts[t2].p+=3;else{pts[t1].p+=1;pts[t2].p+=1;}});
  let html='';
  Object.keys(groups).sort().forEach(g=>{const teams=groups[g];teams.forEach(t=>{const p=pts[t.name];t.pts=p?p.p:0;t.gf=p?p.gf:0;t.ga=p?p.ga:0;t.gd=t.gf-t.ga;});teams.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);html+=`<div class="sg"><h3>${g}组</h3><table class="st"><thead><tr><th>#</th><th>球队</th><th>分</th><th>GF</th><th>GA</th></tr></thead><tbody>`;teams.forEach((t,i)=>{let cls='';if(i<2)cls='adv';else if(i===2)cls='adv3';html+=`<tr class="${cls}"><td>${i+1}</td><td class="tn">${t.flag} ${t.name}</td><td><b>${t.pts}</b></td><td>${t.gf}</td><td>${t.ga}</td></tr>`;});html+='</tbody></table></div>';});
  document.getElementById('content').innerHTML=html||'<div class="nd"><div class="ni">📊</div><p>暂无积分数据</p></div>';
}
function renderBracket(){
  const rounds=[{n:'1/16决赛',m:KO.filter(x=>x[5]==='1/16决赛')},{n:'1/8决赛',m:KO.filter(x=>x[5]==='1/8决赛')},{n:'1/4决赛',m:KO.filter(x=>x[5]==='1/4决赛')},{n:'半决赛',m:KO.filter(x=>x[5]==='半决赛')},{n:'决赛',m:KO.filter(x=>x[5]==='决赛'||x[5]==='三四名决赛')}];
  let html='<div class="bc"><div class="bk">';
  rounds.forEach(r=>{html+=`<div class="bcol"><h4>${r.n}</h4>`;r.m.forEach(m=>{const[mn,,,,matchup,,skey]=m;const s=S(skey);const res=GR(mn);html+=`<div class="bm"><div class="bt">${matchup}</div><div class="bd">${res?res.t1s+'-'+res.t2s:'vs'} | ${s.city}</div></div>`;});html+='</div>';});
  html+='</div></div>';
  document.getElementById('content').innerHTML=html;
}
function renderPlayers(){
  const search=document.getElementById('search').value.toLowerCase().trim();
  let html='',total=0;
  Object.keys(P).sort().forEach(t=>{const roster=P[t];if(!roster.length)return;const info=TEAMS_D[t];if(!info)return;if(gfilt&&info.g!==gfilt)return;let f=roster;if(search)f=roster.filter(p=>p[0].includes(search)||p[2].includes(search));if(!f.length)return;html+=`<div class="pt"><h3>${t}</h3><div class="pm">${info.g}组 | 👔${info.mgr} | ⭐${info.cap} | #${RANKINGS[t]||'-'}</div><div class="pg">`;f.forEach(p=>{const[nm,pos,club,num,isCap]=p;html+=`<div class="pc${isCap?' cap':''}"><span class="pn">${num}</span><div class="pi"><div class="pna">${nm}${isCap?' ⭐':''}</div><div class="pd"><span class="pp">${pos}</span>${club}</div></div></div>`;});html+='</div></div>';total+=f.length;});
  document.getElementById('content').innerHTML=html||'<div class="nd"><div class="ni">👤</div><p>没有匹配的球员</p></div>';
  document.getElementById('cnt').textContent=`${total}人`;
}
function renderStadiums(){
  let html='';
  Object.entries(STADIUMS).forEach(([k,s])=>{const gc=GM.filter(m=>m[8]===k).length;const kc=KO.filter(m=>m[6]===k).length;html+=`<div class="sc"><div class="scity">${s.city}</div><div class="sname">🏟️ ${s.name}</div><div class="sd"><span>🕐${s.tz}</span><span>👥${s.cap}</span><span>🌿${s.surf}</span><span>🏗️${s.roof}</span></div><div class="sn">📅 小组${gc}+淘汰${kc}=${gc+kc}场</div></div>`;});
  document.getElementById('content').innerHTML=html;
}

// Filters
function AF(){
  if(ctab==='players'){renderPlayers();return;}
  if(ctab==='standings')return;
  if(ctab==='bracket')return;
  if(ctab==='stadiums'){const s=document.getElementById('search').value.toLowerCase().trim();document.querySelectorAll('#content .sc').forEach(c=>c.style.display=(s&&!(c.textContent||'').toLowerCase().includes(s))?'none':'');return;}
  const search=document.getElementById('search').value.toLowerCase().trim();
  const gfv=document.getElementById('gf').value;
  let n=0;
  document.querySelectorAll('#content .mc').forEach(c=>{
    const d=(c.getAttribute('data-search')||'').toLowerCase();
    let show=true;
    if(search&&!d.includes(search))show=false;
    if(gfilt&&!d.includes(gfilt))show=false;
    if(gfv&&!d.includes(gfv))show=false;
    const m=JSON.parse(c.getAttribute('data-m')||'[]');
    if(fav.length&&m.length&&!fav.includes(tk(m[4]))&&!fav.includes(tk(m[5])))show=false;
    c.style.display=show?'':'none';
    if(show)n++;
  });
  document.getElementById('cnt').textContent=`${n}场`;
  document.getElementById('nodata').style.display=n===0?'':'none';
}
function RF(){document.getElementById('search').value='';document.getElementById('gf').value='';gfilt='';document.querySelectorAll('.chip').forEach(c=>c.classList.remove('ac'));AF();}
function filterByGroup(g){gfilt=(g===gfilt)?'':g;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('ac',c.textContent===g&&gfilt===g));AF();}

// Tabs
function ST(tab){
  ctab=tab;document.querySelectorAll('.bn').forEach(b=>b.classList.remove('ac'));document.querySelectorAll('.bn').forEach(b=>{if(b.textContent.includes(tab==='matches'?'比赛':tab==='standings'?'积分':tab==='bracket'?'对阵图':tab==='players'?'球员':'场馆'))b.classList.add('ac');});
  document.getElementById('nodata').style.display='none';
  if(tab==='matches')renderMatches();
  else if(tab==='standings')renderStandings();
  else if(tab==='bracket')renderBracket();
  else if(tab==='players')renderPlayers();
  else if(tab==='stadiums')renderStadiums();
}

// Favs
function renderFavs(){
  const teams=[...new Set(GM.map(m=>tk(m[4])))].sort();
  let h='';
  teams.forEach(t=>{h+=`<span class="fc${fav.includes(t)?' ac':''}" onclick="toggleFav('${t}')">⭐${t}</span>`;});
  document.getElementById('favs').innerHTML=h;
}
function toggleFav(t){if(fav.includes(t))fav=fav.filter(x=>x!==t);else fav.push(t);localStorage.setItem('wc2026_favs_m',JSON.stringify(fav));renderFavs();if(ctab==='matches'){renderMatches();AF();}}

// Countdown
function updateCD(){
  const all=[...GM,...KO];const now=new Date();let next=null;
  for(const m of all){const[_,mo,da]=m[1].match(/(\d+)\.(\d+)/)||[];if(!mo)continue;const[hr,mi]=m[2].split(':').map(Number);const d=new Date(2026,parseInt(mo)-1,parseInt(da),hr,mi);if(d>now&&(!next||d<next.date))next={date:d,match:m};}
  if(!next){document.getElementById('cdTimer').textContent='已结束';return;}
  const diff=next.date-now;
  document.getElementById('cdNext').textContent=`距 ${next.match[0]} ${next.match[4]}vs${next.match[5]}：`;
  document.getElementById('cdTimer').textContent=`${Math.floor(diff/864e5)}天${Math.floor((diff%864e5)/36e5)}时`;
}
setInterval(updateCD,6e4);updateCD();

// Init
(function(){
  let chips='';'ABCDEFGHIJKL'.split('').forEach(g=>{chips+=`<span class="chip" onclick="filterByGroup('${g}')">${g}组</span>`;});
  document.getElementById('gchips').innerHTML=chips;
  const gf=document.getElementById('gf');'ABCDEFGHIJKL'.split('').forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g+'组';gf.appendChild(o);});
  renderFavs();renderMatches();
})();

function renderTab(){if(ctab==='matches')renderMatches();else if(ctab==='standings')renderStandings();else if(ctab==='bracket')renderBracket();}
