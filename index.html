<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>2026世界杯赛程</title>
<style>
:root{--bg:#0a0e17;--s:#111827;--b:#1e293b;--t:#e2e8f0;--m:#94a3b8;--a:#f59e0b;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;padding-bottom:70px}
.header{background:linear-gradient(135deg,#0f172a,#1a2332,#0f172a);border-bottom:2px solid var(--a);padding:20px 16px 14px;text-align:center}
.header h1{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#f59e0b,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.header .sub{font-size:.65rem;color:var(--m);letter-spacing:2px}
.flag-row{font-size:1.3rem;margin-bottom:4px}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid var(--b);display:flex;z-index:99;padding-bottom:env(safe-area-inset-bottom)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border:none;background:none;color:var(--m);font-size:.7rem;cursor:pointer;transition:color .2s;min-height:56px}
.bnav-btn .bn-icon{font-size:1.2rem;margin-bottom:2px}
.bnav-btn.active{color:var(--a)}

/* Toolbar */
.toolbar{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;background:var(--s);border-bottom:1px solid var(--b);align-items:center}
.toolbar input,.toolbar select{flex:1;min-width:0;background:#1a2235;border:1px solid var(--b);color:var(--t);padding:8px 10px;border-radius:8px;font-size:.8rem;outline:none}
.toolbar input::placeholder{color:#64748b}
.toolbar select{cursor:pointer;max-width:120px}
.toolbar .btn-f{background:var(--a);color:#000;border:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:.78rem;cursor:pointer;flex-shrink:0}
.count{font-size:.7rem;color:var(--m);white-space:nowrap}

/* Filter chips */
.chips{display:flex;gap:5px;padding:8px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:#0f172a}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:16px;font-size:.73rem;background:#1a2235;border:1px solid var(--b);color:var(--m);cursor:pointer;transition:all .2s;white-space:nowrap}
.chip.active{border-color:var(--a);color:var(--a);background:#1f2940}

/* Match card */
.matches{padding:8px}
.mcard{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px;margin-bottom:8px;transition:all .2s;cursor:pointer;position:relative}
.mcard:active{opacity:.8;transform:scale(.98)}
.mcard.hl{border-left:3px solid var(--a)}
.mcard.opener{border-left:3px solid #ef4444}
.mcard.final{border-left:3px solid #fbbf24;background:linear-gradient(135deg,#1a1a0a,#111827)}
.mcard .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mcard .gnum{font-size:.65rem;color:var(--m)}
.mcard .gbadge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:700}
.g-A{background:#dc2626;color:#fff}.g-B{background:#2563eb;color:#fff}.g-C{background:#16a34a;color:#fff}
.g-D{background:#ca8a04;color:#000}.g-E{background:#9333ea;color:#fff}.g-F{background:#0891b2;color:#fff}
.g-G{background:#db2777;color:#fff}.g-H{background:#ea580c;color:#fff}.g-I{background:#4f46e5;color:#fff}
.g-J{background:#65a30d;color:#000}.g-K{background:#c026d3;color:#fff}.g-L{background:#0d9488;color:#fff}
.g-KO{background:#f59e0b;color:#000}
.mcard .teams{font-size:.95rem;font-weight:700;text-align:center;margin:6px 0;letter-spacing:.5px}
.mcard .teams .vs{color:var(--m);margin:0 6px;font-weight:400;font-size:.75rem}
.mcard .minfo{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.7rem;color:var(--m);margin-top:8px}
.mcard .minfo span{background:#1a2235;padding:2px 7px;border-radius:4px}

/* Expanded detail */
.mcard .detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--b)}
.mcard.expanded .detail{display:block}
.mcard .dsection{margin-bottom:12px}
.mcard .dsection h4{font-size:.78rem;color:var(--a);margin-bottom:6px}
.mcard .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.72rem;color:#cbd5e1}
.mcard .dgrid span{display:flex;align-items:center;gap:3px}
.mcard .rd{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;background:#1a2235;font-size:.72rem;margin-bottom:2px}
.mcard .rd .rnum{width:24px;height:24px;border-radius:50%;background:#0f172a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.68rem;color:var(--a);flex-shrink:0}
.mcard .rd .rname{flex:1;font-weight:500;font-size:.73rem}
.mcard .rd .rpos{font-size:.6rem;padding:1px 4px;border-radius:3px;background:#0f172a;color:var(--a);font-weight:600}
.mcard .rd.cap .rnum{border:2px solid #fbbf24}

/* Players tab */
.pteam{margin-bottom:16px}
.pteam h3{font-size:1rem;margin-bottom:4px}
.pteam .pmeta{font-size:.72rem;color:var(--m);margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pcard{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.pcard .pc-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;background:#1a2235;color:var(--a);flex-shrink:0}
.pcard.captain .pc-num{border:2px solid #fbbf24}
.pcard .pc-info{flex:1;min-width:0}
.pcard .pc-name{font-weight:600;font-size:.8rem}
.pcard .pc-detail{font-size:.67rem;color:var(--m)}
.pcard .pc-pos{font-size:.62rem;padding:1px 4px;border-radius:3px;background:#0f172a;color:var(--a);margin-right:4px}

/* Stadium cards */
.scard{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px;margin-bottom:8px}
.scard .scity{font-weight:700;font-size:.95rem}
.scard .sname{color:var(--a);font-size:.82rem;margin:4px 0}
.scard .scountry{font-size:.72rem;color:var(--m)}
.scard .sdet{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:.72rem;color:#cbd5e1;margin-top:8px;padding-top:8px;border-top:1px solid var(--b)}
.scard .snote{font-size:.7rem;color:#fbbf24;margin-top:6px}

/* Section title */
.stitle{font-size:.95rem;font-weight:700;padding:12px 14px 8px;color:var(--a)}

.no-data{text-align:center;padding:40px 20px;color:var(--m)}
.no-data .icon{font-size:2rem;margin-bottom:8px}

#t-groups,#t-players,#t-stadiums{display:none}
#t-groups.active,#t-players.active,#t-stadiums.active{display:block}

/* Round headers */
.rhead{padding:16px 14px 4px;font-size:.85rem;color:var(--a);font-weight:700}
</style>
</head>

</div>
<div id="t-players">

</div>
<div id="t-stadiums">

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
let currentTab='groups',groupFilter='';

function buildMatchCard(m,isKO){
  const [mn,date,bj,local,t1,t2,g,rnd,skey]=m;
  const s=getStadium(skey);
  const isOpener=(mn==='M1'),isFinal=(rnd==='决赛');
  let cls='mcard';
  if(isFinal)cls+=' final';
  else if(isOpener)cls+=' opener';
  else if(m.length>9&&m[9])cls+=' hl';
  const rl=isKO?rnd:`${g}组 · ${rnd}`;
  const gCls=isKO?'g-KO':'g-'+g;
  const ds=`${mn} ${date} ${bj} ${local||''} ${t1} ${t2} ${g} ${rnd} ${s.city} ${s.name} ${s.country}`;

  return `<div class="${cls}" data-search="${ds}" data-gr="${g}" data-rnd="${rnd}" data-city="${s.city}" onclick="toggleDetail(this)" data-m='${JSON.stringify(m).replace(/'/g,"&#39;")}' data-isko="${isKO}">
    <div class="mtop">
      <span class="gnum">${mn}</span>
      <span class="gbadge ${gCls}">${rl}</span>
      <span class="gnum">${date}</span>
    </div>
    <div class="teams">${t1} <span class="vs">VS</span> ${t2}</div>
    <div class="minfo">
      <span>🇨🇳 北京 ${bj}</span>
      <span>📍 ${local||''}</span>
      <span>🏟️ ${s.name}</span>
      <span>👥 ${s.cap}</span>
      <span>🌿 ${s.surf}</span>
    </div>
    <div class="detail" id="det-${mn}"></div>
  </div>`;
}

function toggleDetail(el){
  const wasExpanded=el.classList.contains('expanded');
  // Close all expanded
  document.querySelectorAll('.mcard.expanded').forEach(c=>c.classList.remove('expanded'));
  if(!wasExpanded){
    el.classList.add('expanded');
    const det=el.querySelector('.detail');
    if(det&&!det.dataset.loaded){
      const m=JSON.parse(el.getAttribute('data-m'));
      const isKO=el.getAttribute('data-isko')==='true';
      det.innerHTML=buildDetail(m,isKO);
      det.dataset.loaded='1';
    }
  }
}

function buildDetail(m,isKO){
  const [mn,date,bj,local,t1,t2,g,rnd,skey]=m;
  const s=getStadium(skey);
  const note=isKO&&m.length>7?m[7]:'';
  function tk(raw){return raw.replace(/^[^\s]+\s/,'');}
  const k1=tk(t1),k2=tk(t2);

  function findRoster(teamName){
    for(const key of Object.keys(PLAYERS)){
      const keyName=key.replace(/^[^\s]+\s/,'');
      if(keyName===teamName||key.includes(teamName)||teamName.includes(keyName))return{key,roster:PLAYERS[key]};
    }
    return{key:teamName,roster:[]};
  }
  function renderSide(label,roster,info){
    if(!roster||!roster.length)return `<div class="roster-team"><h5>${label}</h5><p style="font-size:.7rem;color:var(--m)">暂无球员数据</p></div>`;
    let rows=roster.map(p=>{const[nm,pos,club,num,isCap]=p;return`<div class="rd${isCap?' cap':''}"><span class="rnum">${num}</span><span class="rname">${nm}${isCap?' ⭐':''}</span><span class="rpos">${pos}</span><span style="font-size:.65rem;color:var(--m)">${club}</span></div>`;}).join('');
    return `<div class="roster-team"><h5>${label}</h5>${rows}</div>`;
  }
  const r1=findRoster(k1),r2=findRoster(k2);
  const i1=TEAMS[r1.key]||null,i2=TEAMS[r2.key]||null;
  return `<div class="dsection"><h4>📋 比赛配置</h4>
    <div class="dgrid">
      <span>🇨🇳 北京 ${date} ${bj}</span><span>📍 当地 ${local||''}</span>
      <span>🏟️ ${s.name}</span><span>🏙️ ${s.city} ${s.country}</span>
      <span>🕐 ${s.tz}</span><span>👥 ${s.cap}</span>
      <span>🌿 ${s.surf}</span><span>🏗️ ${s.roof}</span>
      <span>📅 建成${s.open}</span>${note?`<span>📌 ${note}</span>`:''}
    </div></div>
    <div class="dsection"><h4>👥 双方球员名单</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${renderSide(t1,r1.roster,i1)}${renderSide(t2,r2.roster,i2)}</div></div>`;
}

function renderMatches(){
  let html='';
  const stages=['第1轮','第2轮','第3轮','1/16决赛','1/8决赛','1/4决赛','半决赛','三四名决赛','决赛'];
  const all=[...GM.map(m=>[m,false]),...KO.map(m=>[m,true])];
  stages.forEach(st=>{
    const ms=all.filter(([m,ko])=>m[ko?5:7]===st);
    if(!ms.length)return;
    html+=`<div class="rhead">${st}（${ms.length}场）</div>`;
    ms.forEach(([m,ko])=>html+=buildMatchCard(m,ko));
  });
  document.getElementById('groupContainer').innerHTML=html;
  applyFilters();
}

function renderStadiums(){
  let html='';
  Object.entries(STADIUMS).forEach(([k,s])=>{
    const gc=GM.filter(m=>m[8]===k).length;
    const kc=KO.filter(m=>m[6]===k).length;
    html+=`<div class="scard" data-search="${s.city} ${s.name} ${s.country}"><div class="scity">${s.city}</div><div class="sname">🏟️ ${s.name}</div><div class="scountry">${s.country}</div><div class="sdet"><span>🕐 ${s.tz}</span><span>👥 ${s.cap}</span><span>🌿 ${s.surf}</span><span>🏗️ ${s.roof}</span><span>📅 ${s.open}</span></div>${s.note?`<div class="snote">📌 ${s.note}</div>`:''}<div style="font-size:.73rem;color:var(--a);margin-top:6px">📅 小组${gc}场+淘汰${kc}场=共${gc+kc}场</div></div>`;
  });
  document.getElementById('stadiumContainer').innerHTML=html;
}

function renderPlayersView(){
  const search=document.getElementById('search').value.toLowerCase().trim();
  let html='',total=0;
  const teams=Object.keys(PLAYERS).sort((a,b)=>a.localeCompare(b));
  teams.forEach(t=>{
    const roster=PLAYERS[t];
    if(!roster.length)return;
    const info=TEAMS[t];
    if(!info)return;
    if(groupFilter&&info.g!==groupFilter)return;
    let filtered=roster;
    if(search)filtered=roster.filter(p=>p[0].includes(search)||p[2].includes(search)||p[1].toLowerCase().includes(search));
    if(!filtered.length)return;
    html+=`<div class="pteam"><h3>${t}</h3><div class="pmeta">${info.g}组 | 👔${info.mgr} | ⭐${info.cap}</div><div class="pgrid">`;
    filtered.forEach(p=>{const[nm,pos,club,num,isCap]=p;html+=`<div class="pcard${isCap?' captain':''}"><span class="pc-num">${num}</span><div class="pc-info"><div class="pc-name">${nm}${isCap?' ⭐':''}</div><div class="pc-detail"><span class="pc-pos">${pos}</span>${club}</div></div></div>`;});
    html+='</div></div>';
    total+=filtered.length;
  });
  document.getElementById('playerContainer').innerHTML=html||'<div class="no-data"><div class="icon">👤</div><p>没有匹配的球员</p></div>';
  document.getElementById('cnt').textContent=`共${total}人`;
}

// Filters
function applyFilters(){
  if(currentTab==='players'){renderPlayersView();return;}
  if(currentTab==='stadiums'){
    const search=document.getElementById('search').value.toLowerCase().trim();
    document.querySelectorAll('#stadiumContainer .scard').forEach(c=>{const d=(c.getAttribute('data-search')||'').toLowerCase();c.style.display=(search&&!d.includes(search))?'none':'';});
    return;
  }
  const search=document.getElementById('search').value.toLowerCase().trim();
  const gf=document.getElementById('groupF').value;
  let n=0;
  document.querySelectorAll('#groupContainer .mcard').forEach(c=>{
    const d=(c.getAttribute('data-search')||'').toLowerCase();
    let show=true;
    if(search&&!d.includes(search))show=false;
    if(gf&&!d.includes(gf))show=false;
    if(groupFilter&&!d.includes(groupFilter))show=false;
    c.style.display=show?'':'none';
    if(show)n++;
  });
  document.getElementById('cnt').textContent=`共${n}场`;
  document.getElementById('noData').style.display=n===0?'':'none';
}

function resetFilters(){
  document.getElementById('search').value='';
  document.getElementById('groupF').value='';
  groupFilter='';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  applyFilters();
}

function filterByGroup(g){
  groupFilter=(g===groupFilter)?'':g;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.textContent===g&&c.classList.contains('active')?false:c.textContent===g));
  applyFilters();
}

// Tabs
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('[id^="t-"]').forEach(d=>d.classList.remove('active'));
  document.getElementById('t-'+tab).classList.add('active');
  const btn=[...document.querySelectorAll('.bnav-btn')].find(b=>b.textContent.includes(tab==='groups'?'比赛':tab==='players'?'球员':'场馆'));
  if(btn)btn.classList.add('active');
  if(tab==='players')renderPlayersView();
  if(tab==='stadiums')document.getElementById('cnt').textContent='';
  applyFilters();
}

// Init
(function(){
  // Build group chips
  let chips='';
  'ABCDEFGHIJKL'.split('').forEach(g=>{chips+=`<span class="chip" onclick="filterByGroup('${g}')">${g}组</span>`;});
  document.getElementById('groupChips').innerHTML=chips;
  // Build group dropdown
  const gf=document.getElementById('groupF');
  'ABCDEFGHIJKL'.split('').forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g+'组';gf.appendChild(o);});
  // Render
  renderMatches();
  renderStadiums();
})();
</script>
