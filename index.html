const AM={};
function buildCard(m,isKO){
  const[mn,date,bj,local,t1,t2,g,rnd,skey]=m,s=S(skey),isOpener=(mn==='M1'),isFinal=(rnd==='决赛');
  let cls='mc';if(isFinal)cls+=' final';else if(isOpener)cls+=' opener';else if(m.length>9&&m[9])cls+=' hl';
  const rl=isKO?rnd:g+'组·'+rnd,gCls=isKO?'g-KO':'g-'+g,time=tz==='bj'?bj:local,res=GR(mn),hasRes=!!res;
  const ds=mn+' '+t1+' '+t2+' '+g+' '+rnd+' '+s.city+' '+date;
  AM[mn]={m,isKO};
  return`<div class="${cls}${hasRes?' has-result':''}" data-search="${ds}" data-gr="${g}"><div class="mt"><span class="gn">${mn}</span><span class="gb ${gCls}">${rl}</span><span class="gn">${date}</span></div><div class="tm">${t1}<span class="vs">VS</span>${t2}</div>${hasRes?`<div class="score">${res.t1s}-${res.t2s}</div>`:''}<div class="mi"><span>${time}</span><span>${s.name}</span><span>${s.cap}</span></div><div class="dl-btn"><a href="javascript:void(0)" onclick="event.stopPropagation();openMD('${mn}')">📋 查看详情→</a></div></div>`;
}

// ═══ Modal ═══
function openMD(mn){
  const data=AM[mn];if(!data)return;
  const{m,isKO}=data;
  const[_,date,bj,local,t1,t2,g,rnd,skey]=m,s=S(skey);
  const k1=tk(t1),k2=tk(t2);
  function fr(tn){for(const k of Object.keys(P)){if(k===tn||k.includes(tn)||tn.includes(k))return P[k];}return[];}
  function gti(tn){for(const k of Object.keys(TD)){if(k===tn||k.includes(tn)||tn.includes(k))return TD[k];}return null;}
  const r1=fr(k1),r2=fr(k2),ti1=gti(k1),ti2=gti(k2),res=GR(mn);
  const r1k=RK[k1]||'-',r2k=RK[k2]||'-';
  function rr(label,roster){
    if(!roster||!roster.length)return`<div class="mrs"><h5>${label}</h5><p style="font-size:.62rem;color:var(--m)">暂无数据</p></div>`;
    const po=['GK','DF','MF','FW'],bp={};po.forEach(p=>bp[p]=[]);
    roster.forEach(p=>{const pos=p[1];bp[pos]?bp[pos].push(p):bp.GK.push(p);});
    let h=`<div class="mrs"><h5>${label}</h5>`;
    po.forEach(pos=>{if(!bp[pos].length)return;h+=`<div class="mrp"><div class="mrl">${{GK:'🧤门将',DF:'🛡️后卫',MF:'🎯中场',FW:'⚽前锋'}[pos]}(${bp[pos].length})</div>`;bp[pos].forEach(p=>{const[nm,po2,club,num,isCap]=p;h+=`<div class="mrr${isCap?' cap':''}"><span class="rn">${num}</span><span class="rna">${nm}${isCap?'⭐':''}</span><span class="rc">${club}</span></div>`;});h+='</div>';});
    return h+'</div>';
  }
  const html=`<button class="mc-x" onclick="closeM()">&times;</button>
    <div class="mt2">${t1} VS ${t2}</div>
    <div class="ms">${isKO?rnd:g+'组·'+rnd} | ${mn} | ${date} ${bj}</div>
    ${res?`<div style="text-align:center;font-size:1.5rem;font-weight:800;color:var(--a);margin:8px 0">${res.t1s}-${res.t2s}</div>`:''}
    <div class="msc"><h4>📋 比赛信息</h4><div class="mcg"><span>🇨🇳${date}${bj}</span><span>📍${local||''}</span><span>🏟️${s.name}</span><span>🏙️${s.city}${s.country}</span><span>🕐${s.tz}</span><span>👥${s.cap}</span><span>🌿${s.surf}</span><span>🏗️${s.roof}</span><span>📅${s.open}</span><span>📊#${r1k}vs#${r2k}</span>${ti1?`<span>👔${ti1.mgr}</span>`:''}${ti2?`<span>👔${ti2.mgr}</span>`:''}</div></div>
    <div class="msc"><h4>👥 球员名单（按位置）</h4><div class="mrd">${rr(t1,r1)}${rr(t2,r2)}</div></div>
    <div class="re"><input type="number" id="rs1_${mn}" placeholder="?" style="width:32px"><span>-</span><input type="number" id="rs2_${mn}" placeholder="?" style="width:32px"><input type="text" id="rsn_${mn}" placeholder="备注" style="width:56px"><button onclick="saveR('${mn}')">💾</button></div>`;
  document.getElementById('mc').innerHTML=html;
  document.getElementById('mo').classList.add('open');
}
function closeM(){document.getElementById('mo').classList.remove('open');}
document.getElementById('mo').addEventListener('click',function(e){if(e.target===this)closeM();});
function saveR(mn){const s1=parseInt(document.getElementById('rs1_'+mn)?.value),s2=parseInt(document.getElementById('rs2_'+mn)?.value);if(isNaN(s1)||isNaN(s2))return;const n=document.getElementById('rsn_'+mn)?.value||'';RS[mn]={t1s:s1,t2s:s2,notes:n};sR();closeM();ST(ctab);}

function renderStandings(){
  const groups={};'ABCDEFGHIJKL'.split('').forEach(g=>{groups[g]=[];});
  GM.forEach(m=>{const g=m[6],t1=tk(m[4]),t2=tk(m[5]);if(!groups[g])return;if(!groups[g].find(t=>t.name===t1))groups[g].push({name:t1,flag:m[4]});if(!groups[g].find(t=>t.name===t2))groups[g].push({name:t2,flag:m[5]});});
  const pts={};
  Object.entries(RS).forEach(([mn,res])=>{const m=[...GM,...KO].find(x=>x[0]===mn);if(!m||(m[7]&&m[7].includes('决赛')))return;const t1=tk(m[4]),t2=tk(m[5]);if(!pts[t1])pts[t1]={p:0,gf:0,ga:0};if(!pts[t2])pts[t2]={p:0,gf:0,ga:0};pts[t1].gf+=res.t1s;pts[t1].ga+=res.t2s;pts[t2].gf+=res.t2s;pts[t2].ga+=res.t1s;if(res.t1s>res.t2s)pts[t1].p+=3;else if(res.t1s<res.t2s)pts[t2].p+=3;else{pts[t1].p+=1;pts[t2].p+=1;}});
  let h='';
  Object.keys(groups).sort().forEach(g=>{const teams=groups[g];teams.forEach(t=>{const p=pts[t.name];t.pts=p?p.p:0;t.gf=p?p.gf:0;t.ga=p?p.ga:0;t.gd=t.gf-t.ga;});teams.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);h+=`<div class="sg"><h3>${g}组</h3><table class="st"><thead><tr><th>#</th><th>球队</th><th>分</th><th>GF</th><th>GA</th></tr></thead><tbody>`;teams.forEach((t,i)=>{let c='';if(i<2)c='adv';else if(i===2)c='adv3';h+=`<tr class="${c}"><td>${i+1}</td><td class="tn">${t.flag}${t.name}</td><td><b>${t.pts}</b></td><td>${t.gf}</td><td>${t.ga}</td></tr>`;});h+='</tbody></table></div>';});
  document.getElementById('content').innerHTML=h||'<div class="nd"><div class="ni">📊</div><p>暂无积分</p></div>';
}

function renderPlayers(){
  const s=document.getElementById('search').value.toLowerCase().trim();let h='',t=0;
  Object.keys(P).sort().forEach(k=>{const r=P[k];if(!r.length)return;const i=TD[k];if(!i||(gfilt&&i.g!==gfilt))return;let f=r;if(s)f=r.filter(p=>p[0].includes(s)||p[2].includes(s));if(!f.length)return;h+=`<div class="pt"><h3>${k}</h3><div class="pm">${i.g}组 | 👔${i.mgr} | ⭐${i.cap} | #${RK[k]||'-'}</div><div class="pg">`;f.forEach(p=>{h+=`<div class="pc${p[4]?' cap':''}"><span class="pn">${p[3]}</span><div class="pi"><div class="pna">${p[0]}${p[4]?'⭐':''}</div><div class="pd">${p[1]}·${p[2]}</div></div></div>`;});h+='</div></div>';t+=f.length;});
  document.getElementById('content').innerHTML=h||'<div class="nd"><div class="ni">👤</div><p>无结果</p></div>';document.getElementById('cnt').textContent=t+'人';
}
function renderStadiums(){
  let h='';Object.entries(S_D).forEach(([k,s])=>{const gc=GM.filter(m=>m[8]===k).length,kc=KO.filter(m=>m[6]===k).length;h+=`<div class="sc"><div class="scity">${s.city}</div><div class="sname">🏟️${s.name}</div><div class="sd"><span>🕐${s.tz}</span><span>👥${s.cap}</span><span>🌿${s.surf}</span><span>🏗️${s.roof}</span><span>📅${s.open}</span></div><div class="sn">📅小组${gc}+淘汰${kc}=${gc+kc}场</div></div>`;});
  document.getElementById('content').innerHTML=h;
}

// ═══ Favs ═══
function renderFavs(){const teams=[...new Set(GM.map(m=>tk(m[4])))].sort();let h='';teams.forEach(t=>{h+=`<span class="fc${fav.includes(t)?' ac':''}" onclick="toggleFav('${t}')">⭐${t}</span>`;});document.getElementById('favs').innerHTML=h;}
function toggleFav(t){if(fav.includes(t))fav=fav.filter(x=>x!==t);else fav.push(t);localStorage.setItem('wc2026_favs_m',JSON.stringify(fav));renderFavs();if(ctab==='matches'){renderMatches();AF();}}

// ═══ Filters ═══
function AF(){
  const s=document.getElementById('search').value.toLowerCase().trim(),gv=document.getElementById('gf').value;let n=0;
  document.querySelectorAll('#content .mc').forEach(c=>{const d=(c.getAttribute('data-search')||'').toLowerCase();let sh=true;if(s&&!d.includes(s))sh=false;if(gfilt&&!d.includes(gfilt))sh=false;if(gv&&!d.includes(gv))sh=false;const mn=c.querySelector('.gn')?.textContent;if(mn){const m=[...GM,...KO].find(x=>x[0]===mn);if(m&&fav.length&&!fav.includes(tk(m[4]))&&!fav.includes(tk(m[5])))sh=false;}c.style.display=sh?'':'none';if(sh)n++;});
  document.getElementById('cnt').textContent=n+'场';document.getElementById('nodata').style.display=n===0?'':'none';
}
function RF(){document.getElementById('search').value='';document.getElementById('gf').value='';gfilt='';document.querySelectorAll('.chip').forEach(c=>c.classList.remove('ac'));AF();}
function filterByGroup(g){gfilt=(g===gfilt)?'':g;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('ac',c.textContent===g&&gfilt===g));AF();}

// ═══ Tabs ═══
function ST(tab){
  ctab=tab;document.querySelectorAll('.bn').forEach(b=>b.classList.remove('ac'));document.querySelectorAll('.bn').forEach(b=>{if(b.textContent.includes(tab==='matches'?'比赛':tab==='standings'?'积分':tab==='bracket'?'对阵图':tab==='players'?'球员':'场馆'))b.classList.add('ac');});
  document.getElementById('nodata').style.display='none';
  if(tab==='matches')renderMatches();else if(tab==='standings')renderStandings();else if(tab==='bracket')renderBracket();else if(tab==='players')renderPlayers();else if(tab==='stadiums')renderStadiums();
}

// ═══ Misc ═══
function switchTZ(v){tz=v;if(ctab==='matches')renderMatches();}
function switchTheme(){const cur=document.documentElement.getAttribute('data-theme'),n=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);document.getElementById('thBtn').textContent=n==='dark'?'☀️':'🌙';localStorage.setItem('wc2026_theme_m',n);}
(function(){const s=localStorage.getItem('wc2026_theme_m');if(s){document.documentElement.setAttribute('data-theme',s);document.getElementById('thBtn').textContent=s==='dark'?'☀️':'🌙';}})();
function updateCD(){const all=[...GM,...KO];const now=new Date();let next=null;for(const m of all){const[_,mo,da]=m[1].match(/(\d+)\.(\d+)/)||[];if(!mo)continue;const[hr,mi]=m[2].split(':').map(Number);const d=new Date(2026,parseInt(mo)-1,parseInt(da),hr,mi);if(d>now&&(!next||d<next.date))next={date:d,match:m};}if(!next){document.getElementById('cdTimer').textContent='已结束';return;}const diff=next.date-now;document.getElementById('cdNext').textContent='距'+next.match[0]+' '+next.match[4]+'vs'+next.match[5]+'：';document.getElementById('cdTimer').textContent=Math.floor(diff/864e5)+'天'+Math.floor((diff%864e5)/36e5)+'时'+Math.floor((diff%36e5)/6e4)+'分';}
setInterval(updateCD,6e4);updateCD();

// ═══ Init ═══
(function(){let c='';'ABCDEFGHIJKL'.split('').forEach(g=>{c+=`<span class="chip" onclick="filterByGroup('${g}')">${g}组</span>`;});document.getElementById('gch').innerHTML=c;const gf=document.getElementById('gf');'ABCDEFGHIJKL'.split('').forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g+'组';gf.appendChild(o);});renderFavs();renderMatches();})();
</script>
</body>
