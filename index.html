<style>
:root{--bg:#0a0e17;--s:#111827;--b:#1e293b;--t:#e2e8f0;--m:#94a3b8;--a:#f59e0b;--red:#ef4444;--green:#22c55e}
[data-theme=light]{--bg:#f1f5f9;--s:#fff;--b:#cbd5e1;--t:#1e293b;--m:#64748b;--a:#d97706}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);line-height:1.5;-webkit-tap-highlight-color:transparent;padding-bottom:65px}
.header{background:linear-gradient(135deg,#0f172a,#1a2332,#0f172a);border-bottom:2px solid var(--a);padding:12px 16px 8px;text-align:center;position:sticky;top:0;z-index:50}
.header h1{font-size:1rem;font-weight:800;background:linear-gradient(135deg,#f59e0b,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:.58rem;color:var(--m)}
.progress-bar{height:3px;background:var(--b)}.progress-bar .fill{height:100%;background:var(--a);width:0%}
.progress-text{display:flex;justify-content:space-between;padding:2px 10px;font-size:.55rem;color:var(--m);background:#0f172a}

.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid var(--b);display:flex;z-index:99;padding-bottom:env(safe-area-inset-bottom)}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px;border:none;background:none;color:var(--m);font-size:.6rem;cursor:pointer;min-height:48px}
.bn .bi{font-size:.9rem}.bn.ac{color:var(--a)}

/* Toolbar */
.tb{display:flex;gap:4px;padding:6px 8px;background:var(--s);border-bottom:1px solid var(--b);align-items:center}
.tb input{flex:1;min-width:0;background:#1a2235;border:1px solid var(--b);color:var(--t);padding:5px 7px;border-radius:6px;font-size:.7rem;outline:none}
.tb input::placeholder{color:var(--m)}.tb button{font-size:.65rem;padding:4px 8px;cursor:pointer;border-radius:6px;white-space:nowrap}
.btn-ac{background:var(--a);color:#000;border:none;font-weight:600}
.btn-gh{background:transparent;color:var(--m);border:1px solid var(--b)}.btn-gh.ac{color:var(--a);border-color:var(--a)}
.cn{font-size:.6rem;color:var(--m);white-space:nowrap}

/* Group section */
.gsec{margin:0 0 4px;background:var(--s);border-bottom:1px solid var(--b)}
.ghead{padding:8px 10px 4px;display:flex;align-items:center;gap:6px}
.ghead .gn{font-size:.8rem;font-weight:700;color:var(--a)}
.ghead .gstand{font-size:.6rem;color:var(--m);margin-left:auto}
.gstand table{width:100%;border-collapse:collapse;font-size:.6rem}
.gstand th,.gstand td{padding:2px 3px;text-align:center;border-bottom:1px solid var(--b)}
.gstand th{color:var(--m);font-weight:500;font-size:.55rem}
.gstand .tn{text-align:left;font-weight:600;font-size:.62rem}
.gstand .pts{font-weight:700;color:var(--a)}

/* Match row */
.mr{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;transition:background .15s;font-size:.7rem}
.mr:active{background:rgba(245,158,11,.05)}
.mr .md{font-size:.58rem;color:var(--m);min-width:32px;flex-shrink:0}
.mr .mt{flex:1;text-align:right;min-width:0}
.mr .score-area{min-width:42px;text-align:center;font-weight:800;font-size:.82rem;color:var(--a);flex-shrink:0}
.mr .score-area.pending{color:var(--m);font-size:.55rem;font-weight:400}
.mr .ma{flex:1;text-align:left;min-width:0}
.mr .mv{font-size:.55rem;color:var(--m);flex-shrink:0;text-align:right;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.mr .dot.up{background:var(--a)}.mr .dot.live{background:var(--red);animation:pulse 1s infinite}.mr .dot.done{background:var(--m)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.mr.played .mt,.mr.played .ma,.mr.played .mv{opacity:.6}

/* Round header */
.rh{font-size:.72rem;color:var(--a);font-weight:700;padding:8px 10px 2px;background:var(--bg)}

/* KO section */
.koround{margin:0 0 4px;background:var(--s);border-bottom:1px solid var(--b)}
.koround h3{font-size:.78rem;color:var(--a);padding:8px 10px 4px}

/* Players */
.pt{margin-bottom:12px;padding:0 8px}.pt h3{font-size:.82rem}.pt .pm{font-size:.6rem;color:var(--m);margin-bottom:5px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pc{background:var(--s);border:1px solid var(--b);border-radius:6px;padding:6px 8px;display:flex;align-items:center;gap:6px}
.pc .pn{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.65rem;background:#1a2235;color:var(--a);flex-shrink:0}
.pc.cap .pn{border:2px solid #fbbf24}.pc .pi{flex:1}.pc .pna{font-weight:600;font-size:.7rem}.pc .pd{font-size:.58rem;color:var(--m)}
.sc{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:10px;margin:4px 8px}.sc .scity{font-weight:700;font-size:.8rem}.sc .sname{color:var(--a);font-size:.7rem}

/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:999;display:flex;align-items:center;justify-content:center;padding:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.mo.open{opacity:1;pointer-events:auto}
.md{background:var(--s);border:1px solid var(--b);border-radius:12px;width:100%;max-height:92vh;overflow-y:auto;padding:16px}
.mc-x{position:sticky;top:0;float:right;background:none;border:none;color:var(--m);font-size:1.5rem;cursor:pointer;line-height:1}
.mt{font-size:.95rem;font-weight:700;margin-bottom:2px}.ms{font-size:.65rem;color:var(--m);margin-bottom:10px}
.msc{margin-bottom:12px}.msc h4{font-size:.72rem;color:var(--a);margin-bottom:3px}
.mcg{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:.65rem}
.mrd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mrs h5{font-size:.68rem;margin-bottom:3px}
.mrr{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:4px;background:#1a2235;font-size:.62rem;margin-bottom:1px}
[data-theme=light] .mrr{background:#f1f5f9}
.mrr .rn{width:18px;height:18px;border-radius:50%;background:#0f172a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.55rem;color:var(--a);flex-shrink:0}
.mrr.cap .rn{border:2px solid #fbbf24}.mrr .rna{flex:1}.mrr .rc{font-size:.55rem;color:var(--m)}
.re{display:flex;gap:3px;align-items:center;margin-top:6px}.re input{width:30px;padding:2px;text-align:center;background:var(--s);border:1px solid var(--b);color:var(--t);border-radius:4px;font-size:.65rem}.re button{font-size:.6rem;padding:2px 5px;cursor:pointer}
.nd{text-align:center;padding:40px;color:var(--m)}.btt{position:fixed;bottom:70px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--a);color:#000;border:none;font-size:1rem;cursor:pointer;z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.btt.show{opacity:1;pointer-events:auto}
@media print{body{background:#fff;color:#000;font-size:8pt}.bnav,.tb,.btt,.header{display:none!important}.mr{border:1px solid #ccc}}
</style>
</head>

function buildMatchRow(m,isKO){
  const[mn,date,bj,local,t1,t2,g,rnd,skey]=m,s=SS(skey),res=GR(mn),hasRes=!!res;
  const time=tz==='bj'?bj:local, scoreTxt=hasRes?`${res.t1s}-${res.t2s}`:`VS`;
  const matchDate=new Date(2026,parseInt(date.split('.')[0])-1,parseInt(date.split('.')[1]),parseInt(bj.split(':')[0]),parseInt(bj.split(':')[1]));
  const now=new Date(),isLive=matchDate<=now&&!hasRes;
  let dot='up';if(hasRes)dot='done';else if(isLive)dot='live';
  const scCls=hasRes?'':'pending';
  return`<div class="mr${hasRes?' played':''}" onclick="openMD('${mn}')" data-search="${mn} ${t1} ${t2} ${g} ${rnd} ${s.city} ${date}">
    <span class="md">${date}</span><span class="mt">${t1}</span>
    <span class="score-area ${scCls}">${scoreTxt}</span>
    <span class="ma">${t2}</span>
    <span class="mv">${s.name}</span><span class="dot ${dot}"></span></div>`;
}

function calcStandings(g){
  const gms=GM.filter(m=>m[6]===g);
  const teams={};
  gms.forEach(m=>{
    const t1=tk(m[4]),t2=tk(m[5]);
    if(!teams[t1])teams[t1]={name:t1,flag:m[4].replace(/[^\u{1F1E6}-\u{1F1FF}]/gu,''),pld:0,pts:0,gf:0,ga:0,gd:0};
    if(!teams[t2])teams[t2]={name:t2,flag:m[5].replace(/[^\u{1F1E6}-\u{1F1FF}]/gu,''),pld:0,pts:0,gf:0,ga:0,gd:0};
    const res=GR(m[0]);
    if(!res)return;
    teams[t1].pld++;teams[t2].pld++;
    teams[t1].gf+=res.t1s;teams[t1].ga+=res.t2s;
    teams[t2].gf+=res.t2s;teams[t2].ga+=res.t1s;
    if(res.t1s>res.t2s)teams[t1].pts+=3;
    else if(res.t1s<res.t2s)teams[t2].pts+=3;
    else{teams[t1].pts+=1;teams[t2].pts+=1;}
  });
  const arr=Object.values(teams);
  arr.forEach(t=>{t.gd=t.gf-t.ga;});
  arr.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  return arr;
}

function renderStandings(){
  let h='';
  'ABCDEFGHIJKL'.split('').forEach(g=>{
    const teams=calcStandings(g);
    if(!teams.length)return;
    h+=`<div class="gsec"><div class="ghead"><span class="gn">${g}组</span></div><div class="gstand" style="padding:6px"><table><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>GF</th><th>GA</th><th>GD</th><th>分</th></tr>`;
    teams.forEach((t,i)=>{
      const wins=Math.floor(t.pts/3),draws=t.pts%3,losses=t.pld-wins-draws;
      let c='';if(i<2)c='style=background:rgba(34,197,94,.08)';if(i===2)c='style=background:rgba(245,158,11,.08)';
      h+=`<tr ${c}><td>${i+1}</td><td class="tn" style=font-size:.68rem>${t.flag} ${t.name}</td><td>${t.pld}</td><td>${wins}</td><td>${draws}</td><td>${losses}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gd>=0?'+':''}${t.gd}</td><td class="pts">${t.pts}</td></tr>`;
    });
    h+='</table></div></div>';
  });
  document.getElementById('content').innerHTML=h||'<div class=nd>暂无积分数据</div>';
}

function getGroupStandings(){
  const result={};
  'ABCDEFGHIJKL'.split('').forEach(g=>{result[g]=calcStandings(g);});
  return result;
}
function resolveTeam(label){
  // Resolve labels like "A1","B2","W73","3rd(A/B/C/D/F)"
  if(!label)return'?';
  label=label.trim();
  // Already a winner label
  if(label.startsWith('W-'))label=label.replace('W-','');
  if(label.startsWith('L-'))label=label.replace('L-','');
  // Match winner: e.g. "W73" or "M73"
  if(label.startsWith('M')){
    const res=GR(label);
    if(res){
      const m=KO.find(x=>x[0]===label)||GM.find(x=>x[0]===label);
      if(m){
        const t1=tk(m[4]),t2=tk(m[5]);
        if(res.t1s>res.t2s)return t1;
        if(res.t2s>res.t1s)return t2;
        return t1+'/PK'; // draw, went to penalties
      }
    }
    return label; // not played yet
  }
  // Group position: e.g. "A2", "C1"
  const gMatch=label.match(/^([A-L])([123])$/);
  if(gMatch){
    const g=gMatch[1],pos=parseInt(gMatch[2])-1;
    const st=calcStandings(g);
    if(st&&st[pos])return st[pos].name;
    return label;
  }
  // 3rd place: e.g. "3rd(A/B/C/D/F)"
  if(label.startsWith('3rd')){
    // Extract groups from parentheses
    const gm=label.match(/\(([^)]+)\)/);
    if(gm){
      const groups=gm[1].split('/');
      // Find best 3rd place from these groups
      let best=null;
      groups.forEach(g=>{
        const st=calcStandings(g);
        if(st&&st[2]&&(!best||st[2].pts>best.pts||(st[2].pts===best.pts&&st[2].gd>best.gd))){
          best=st[2];
        }
      });
      if(best)return best.name;
    }
    return'3rd';
  }
  return label;
}

function renderBracket(){

  const rounds=['R32','R16','QF','SF'];
  const rLabels={'R32':'1/16决赛','R16':'1/8决赛','QF':'1/4决赛','SF':'半决赛'};

  let h='<div style="overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch"><div style="display:flex;gap:4px;min-width:1000px;padding:0 4px">';
  rounds.forEach(r=>{
    const ms=roundMatches[r];
    const cw=r==='R32'?105:r==='R16'?110:r==='QF'?115:120;
    h+=`<div style="flex:1;min-width:${cw}px"><div style="text-align:center;font-size:.65rem;color:var(--a);font-weight:700;padding:6px 0 4px">${rLabels[r]}</div>`;
    ms.forEach((m,i)=>{
      const[mn,date,,,mu]=m;const s=SS(m[6]);const res=GR(mn);
      // Resolve team names from labels
      const parts=mu.split(' vs ');
      let t1=resolveTeam(parts[0]),t2=resolveTeam(parts[1]||'');

      if(t1.length>6)t1=t1.substring(0,5)+'…';

      let scoreTxt='VS';
      if(res)scoreTxt=`${res.t1s}-${res.t2s}`;

        <div style="font-weight:800;color:var(--a);font-size:.7rem;line-height:1.3">${scoreTxt}</div>
        <div style="font-size:.45rem;color:var(--m)">${s.name.substring(0,8)}</div>
      </div>`;
    });
    h+='</div>';
  });
  // Final column
  const finalMs=KO.filter(m=>m[5]==='F'||m[5]==='3rd');
  h+=`<div style="flex:1;min-width:120px"><div style="text-align:center;font-size:.65rem;color:var(--a);font-weight:700;padding:6px 0 4px">决赛</div>`;
  finalMs.forEach(m=>{
    const[mn,,,,mu]=m;const res=GR(mn);
    const parts=mu.split(' vs ');
    let t1=resolveTeam(parts[0]),t2=resolveTeam(parts[1]||'');
    let scoreTxt='VS';if(res)scoreTxt=`${res.t1s}-${res.t2s}`;
    h+=`<div onclick="openMD('${mn}')" style="background:var(--s);border:1px solid var(--b);border-radius:6px;padding:4px 5px;margin:3px 0;cursor:pointer;font-size:.58rem;text-align:center">
      <div style="font-size:.48rem;color:var(--m)">${m[5]==='F'?'🏆决赛':'🥉三四名'} ${mn}</div>
      <div style="font-weight:600"><span>${t1}</span> vs <span>${t2}</span></div>
      <div style="font-weight:800;color:var(--a);font-size:.7rem">${scoreTxt}</div>
    </div>`;
  });
  h+='</div></div>';
  // Bottom match list
  h+='<div style="padding:8px"><div style="font-size:.75rem;color:var(--a);font-weight:700;padding:4px 0">全部淘汰赛对阵</div>';
  const allStages={'R32':'1/16决赛','R16':'1/8决赛','QF':'1/4决赛','SF':'半决赛','3rd':'三四名决赛','F':'决赛'};
  Object.entries(allStages).forEach(([k,v])=>{
    const ms=KO.filter(m=>m[5]===k);
    ms.forEach(m=>h+=buildMatchRow(m,true));
  });
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function openMD(mn){
  let m,isKO;
  m=GM.find(x=>x[0]===mn);if(m){isKO=false;}
  else{m=KO.find(x=>x[0]===mn);if(m){isKO=true;}else return;}
  const[_,date,bj,local,t1,t2,g,rnd,skey]=m,s=SS(skey),res=GR(mn);
  const k1=tk(t1),k2=tk(t2);
  function fr(tn){for(const k of Object.keys(P)){if(k===tn||k.includes(tn)||tn.includes(k))return P[k];}return[];}
  const r1=fr(k1),r2=fr(k2);
  function rs(label,roster){if(!roster||!roster.length)return`<div class="mrs"><h5>${label}</h5><p style=font-size:.6rem;color:var(--m)>暂无</p></div>`;const po=['GK','DF','MF','FW'],bp={};po.forEach(p=>bp[p]=[]);roster.forEach(p=>{const pos=p[1];bp[pos]?bp[pos].push(p):bp.GK.push(p);});let h=`<div class="mrs"><h5>${label}</h5>`;po.forEach(pos=>{if(!bp[pos].length)return;bp[pos].forEach(p=>{h+=`<div class="mrr${p[4]?' cap':''}"><span class="rn">${p[3]}</span><span class="rna">${p[0]}${p[4]?' ⭐':''}</span><span class="rc">${p[2]}</span></div>`;});});return h+'</div>';}
  const html=`<button class="mc-x" onclick="closeM()">&times;</button>
    <div class="mt">${t1} VS ${t2}</div>
    <div class="ms">${isKO?rnd:g+'组·'+rnd} | ${mn} | ${date} ${bj} | ${s.city}</div>
    ${res?`<div style="text-align:center;font-size:1.8rem;font-weight:800;color:var(--a);margin:8px 0">${res.t1s}-${res.t2s}</div>`:''}
    <div class="msc"><h4>📋 信息</h4><div class="mcg"><span>🇨🇳${date} ${bj}</span><span>📍${local||''}</span><span>🏟️${s.name}</span><span>🏙️${s.city}${s.c}</span><span>🕐${s.tz}</span><span>👥${s.cap}</span></div></div>
    <div class="msc"><h4>👥 球员</h4><div class="mrd">${rs(t1,r1)}${rs(t2,r2)}</div></div>
    <div class="re"><input type="number" id="qe1_${mn}" placeholder="?"><span>-</span><input type="number" id="qe2_${mn}" placeholder="?"><input type="text" id="qen_${mn}" placeholder="备注" style=width:60px><button onclick="saveR('${mn}')">💾</button></div>`;
  document.getElementById('mc').innerHTML=html;document.getElementById('mo').classList.add('open');
}

}
