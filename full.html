<style>
:root{
  --bg:#0a0e17;--surface:#111827;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;
  --accent:#f59e0b;--accent2:#3b82f6;--red:#ef4444;--green:#22c55e;
  --radius:10px;--header-bg:linear-gradient(135deg,#0f172a,#1a2332,#0f172a);
}
[data-theme="light"]{
  --bg:#f1f5f9;--surface:#ffffff;--border:#cbd5e1;--text:#1e293b;--muted:#64748b;
  --accent:#d97706;--header-bg:linear-gradient(135deg,#0f172a,#1e3a5f,#0f172a);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;transition:background .3s,color .3s}
.header{
  background:var(--header-bg);border-bottom:3px solid var(--accent);
  padding:20px 20px 16px;text-align:center;position:sticky;top:0;z-index:100;
}
.header h1{font-size:clamp(1.3rem,4vw,2rem);font-weight:800;background:linear-gradient(135deg,#f59e0b,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.header .sub{color:var(--muted);font-size:.8rem;letter-spacing:3px;margin-top:4px}
.header .flag-row{font-size:1.6rem}

/* Countdown */
.countdown-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;background:#1a2235;border-bottom:1px solid var(--border);
  font-size:.85rem;flex-wrap:wrap;
}
[data-theme="light"] .countdown-bar{background:#e2e8f0}
.countdown-bar .cd-timer{color:var(--accent);font-weight:700;font-size:.95rem}
.countdown-bar .cd-next{color:var(--text)}

/* Stats */
.stats-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.stat-item{background:#1a2235;border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;text-align:center;min-width:70px}
[data-theme="light"] .stat-item{background:#f1f5f9}
.stat-item .num{font-size:1.2rem;font-weight:700;color:var(--accent)}
.stat-item .label{font-size:.65rem;color:var(--muted);letter-spacing:1px}

.container{max-width:1500px;margin:0 auto;padding:16px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius);font-size:.82rem;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.toolbar input{flex:1;min-width:160px;max-width:360px}
.toolbar input::placeholder{color:var(--muted)}
.toolbar select{cursor:pointer}
.btn-sm{background:var(--accent);color:#000;border:none;padding:8px 14px;border-radius:var(--radius);font-weight:600;cursor:pointer;font-size:.8rem}
.btn-sm:hover{opacity:.85}
.result-count{color:var(--muted);font-size:.8rem;margin-left:auto;white-space:nowrap}

/* Theme + TZ toggles */
.theme-btn{position:absolute;top:14px;right:20px;background:none;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:.75rem;z-index:101;transition:all .2s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Tabs */
.tabs{display:flex;gap:3px;margin-bottom:16px;flex-wrap:wrap;background:var(--surface);border-radius:var(--radius);padding:3px}
.tab-btn{padding:8px 16px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:7px;font-size:.82rem;font-weight:500;transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:var(--text);background:#1e293b}
.tab-btn.active{background:var(--accent);color:#000;font-weight:700}

/* Favorite chips */
.fav-bar{display:flex;flex-wrap:wrap;gap:5px;padding:8px 0;margin-bottom:12px}
.fav-chip{padding:4px 10px;border-radius:16px;font-size:.73rem;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s}
.fav-chip:hover,.fav-chip.active{border-color:var(--accent);color:var(--accent)}

/* Match cards */
.matches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:8px}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:all .2s;cursor:pointer;position:relative}
.match-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(245,158,11,.1)}
.match-card.hl{border-left:3px solid var(--accent)}
.match-card.opener{border-left:3px solid #ef4444}
.match-card.final-match{border-left:3px solid #fbbf24;background:linear-gradient(135deg,#1a1a0a,#111827)}
[data-theme="light"] .match-card.final-match{background:linear-gradient(135deg,#fef3c7,#fff)}
.match-card .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.match-card .gnum{font-size:.65rem;color:var(--muted)}
.match-card .gbadge{display:inline-block;padding:2px 8px;border-radius:14px;font-size:.7rem;font-weight:700}
.g-A{background:#dc2626;color:#fff}.g-B{background:#2563eb;color:#fff}.g-C{background:#16a34a;color:#fff}
.g-D{background:#ca8a04;color:#000}.g-E{background:#9333ea;color:#fff}.g-F{background:#0891b2;color:#fff}
.g-G{background:#db2777;color:#fff}.g-H{background:#ea580c;color:#fff}.g-I{background:#4f46e5;color:#fff}
.g-J{background:#65a30d;color:#000}.g-K{background:#c026d3;color:#fff}.g-L{background:#0d9488;color:#fff}.g-KO{background:#f59e0b;color:#000}
.match-card .teams{font-size:1.05rem;font-weight:700;text-align:center;margin:6px 0}
.match-card .teams .vs{color:var(--muted);margin:0 8px;font-weight:400;font-size:.78rem}
.match-card .score{font-size:1.4rem;font-weight:800;text-align:center;margin:8px 0;color:var(--accent);display:none}
.match-card.has-result .score{display:block}
.match-card .minfo{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.73rem;color:var(--muted);margin-top:8px}
.match-card .minfo span{background:#1a2235;padding:2px 7px;border-radius:4px}
[data-theme="light"] .match-card .minfo span{background:#f1f5f9}
.match-card .detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.match-card.expanded .detail{display:block}
.match-card .dsection{margin-bottom:14px}
.match-card .dsection h4{font-size:.8rem;color:var(--accent);margin-bottom:6px}
.match-card .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.75rem;color:var(--text)}
.match-card .roster-grid{display:grid;grid-template-columns:1fr;gap:3px}
.match-card .rrow{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:5px;background:#1a2235;font-size:.72rem}
[data-theme="light"] .match-card .rrow{background:#f1f5f9}
.match-card .rrow .rnum{width:24px;height:24px;border-radius:50%;background:#0f172a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.68rem;color:var(--accent);flex-shrink:0}
.match-card .rrow .rname{flex:1;font-weight:500}
.match-card .rrow .rpos{font-size:.6rem;padding:1px 4px;border-radius:3px;background:#0f172a;color:var(--accent)}
.match-card .rrow.cap .rnum{border:2px solid #fbbf24}
.match-card .result-edit{margin-top:8px;display:flex;gap:6px;align-items:center}
.match-card .result-edit input{width:40px;padding:4px;text-align:center;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.8rem}
.match-card .result-edit button{font-size:.7rem;padding:3px 8px;cursor:pointer}

/* Standings */
.stg-group{margin-bottom:20px}
.stg-group h3{font-size:.95rem;color:var(--accent);margin-bottom:8px}
.stg-table{width:100%;border-collapse:collapse;font-size:.78rem}
.stg-table th,.stg-table td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--border)}
.stg-table th{color:var(--muted);font-weight:500;font-size:.7rem}
.stg-table td{font-weight:500}
.stg-table .tname{text-align:left;font-weight:600}
.stg-table tr.adv td{background:rgba(34,197,94,.08)}
.stg-table tr.adv3 td{background:rgba(245,158,11,.08)}

/* Bracket */
.bracket-container{overflow-x:auto;padding:20px 0}
.bracket{display:flex;gap:24px;min-width:900px}
.bracket-col{display:flex;flex-direction:column;gap:8px;min-width:160px}
.bracket-col h4{font-size:.8rem;color:var(--accent);margin-bottom:4px;text-align:center}
.bracket-match{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.75rem;text-align:center}
.bracket-match .bt{font-weight:600}
.bracket-match .bd{font-size:.65rem;color:var(--muted)}
.bracket-lines{display:flex;align-items:center;width:20px}

/* Players */
.player-header{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.player-team-title{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.player-team-meta{font-size:.75rem;color:var(--muted);margin-bottom:12px}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.player-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;transition:all .2s}
.player-card:hover{border-color:var(--accent)}
.player-card .pnum{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;background:#1a2235;color:var(--accent);flex-shrink:0}
.player-card.captain .pnum{border:2px solid #fbbf24}
.player-card .pinfo{flex:1;min-width:0}
.player-card .pname{font-weight:600;font-size:.82rem}
.player-card .pdetail{font-size:.7rem;color:var(--muted);display:flex;gap:6px}
.player-card .ppos{font-size:.63rem;padding:2px 5px;border-radius:3px;background:#0f172a;color:var(--accent)}
.player-selector{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.ps-chip{padding:5px 10px;border-radius:16px;font-size:.73rem;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s}
.ps-chip:hover,.ps-chip.active{border-color:var(--accent);color:var(--accent)}

/* Stadium */
.stadium-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.stadium-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stadium-card .scity{font-weight:700;font-size:1rem}
.stadium-card .sname{color:var(--accent);font-size:.85rem;margin:4px 0}
.stadium-card .scountry{font-size:.72rem;color:var(--muted)}
.stadium-card .sdet{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:.72rem;color:var(--text);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.stadium-card .snote{margin-top:6px;font-size:.72rem;color:#fbbf24}

/* Footer */
.footer{text-align:center;padding:20px;color:var(--muted);font-size:.72rem;border-top:1px solid var(--border);margin-top:30px}

/* No results */
.no-results{text-align:center;padding:50px 20px;color:var(--muted)}

@media(max-width:600px){
  .matches-grid{grid-template-columns:1fr}
  .toolbar{flex-direction:column}
  .toolbar input{max-width:100%}
  .stat-item{padding:6px 10px;min-width:60px}
  .stat-item .num{font-size:1rem}
}

/* Print styles */
@media print{
  body{background:#fff;color:#000;font-size:10pt}
  .header{position:static;border-bottom:2px solid #000;background:none}
  .header h1{-webkit-text-fill-color:#000;background:none}
  .toolbar,.tabs,.bnav,.countdown-bar,.theme-btn,.fav-bar,.stats-bar{display:none!important}
  .match-card{border:1px solid #ccc;page-break-inside:avoid;box-shadow:none;transform:none!important}
  .detail{display:block!important}
  .container{max-width:100%}
  .footer{border-top:1px solid #000}
  .no-results{display:none!important}
}
</style>

function updateCountdown(){
  const all=[...GM,...KO];
  const now=new Date();
  let next=null;
  for(const m of all){
    const[matchStr]=m[1].match(/(\d+)\.(\d+)/)||[];
    if(!matchStr)continue;
    const[_,mon,day]=m[1].match(/(\d+)\.(\d+)/);
    const[hr,min]=m[2].split(':').map(Number);
    const d=new Date(2026,parseInt(mon)-1,parseInt(day),hr,min,0);
    if(d>now&&(!next||d<next.date)){next={date:d,match:m};}
  }
  const el=document.getElementById('cdTimer');
  const elNext=document.getElementById('cdNext');
  if(!next){el.textContent='比赛已全部结束';return;}
  const diff=next.date-now;
  const days=Math.floor(diff/86400000);
  const hrs=Math.floor((diff%86400000)/3600000);
  const mins=Math.floor((diff%3600000)/60000);
  elNext.textContent=`距 ${next.match[0]} ${next.match[4]} vs ${next.match[5]}：`;
  el.textContent=`${days}天${hrs}时${mins}分`;
}
setInterval(updateCountdown,60000);updateCountdown();

function renderStandings(){
  const groups={};
  'ABCDEFGHIJKL'.split('').forEach(g=>{groups[g]=[];});
  // Collect all team names per group
  GM.forEach(m=>{const g=m[6],t1=teamKey(m[4]),t2=teamKey(m[5]);if(!groups[g])return;if(!groups[g].find(t=>t.name===t1))groups[g].push({name:t1,flag:m[4]});if(!groups[g].find(t=>t.name===t2))groups[g].push({name:t2,flag:m[5]});});
  // Calculate points from results
  const pts={};
  Object.entries(RESULTS).forEach(([mn,res])=>{
    const m=[...GM,...KO].find(x=>x[0]===mn);
    if(!m||m[7]&&m[7].includes('决赛'))return;
    const t1=teamKey(m[4]),t2=teamKey(m[5]);
    if(!pts[t1])pts[t1]={p:0,gf:0,ga:0,gd:0};if(!pts[t2])pts[t2]={p:0,gf:0,ga:0,gd:0};
    pts[t1].gf+=res.t1s;pts[t1].ga+=res.t2s;pts[t2].gf+=res.t2s;pts[t2].ga+=res.t1s;
    if(res.t1s>res.t2s)pts[t1].p+=3;else if(res.t1s<res.t2s)pts[t2].p+=3;else{pts[t1].p+=1;pts[t2].p+=1;}
  });
  Object.keys(pts).forEach(k=>{pts[k].gd=pts[k].gf-pts[k].ga;});

  let html='';
  Object.keys(groups).sort().forEach(g=>{
    const teams=groups[g];
    teams.forEach(t=>{const p=pts[t.name];t.pts=p?p.p:0;t.gf=p?p.gf:0;t.ga=p?p.ga:0;t.gd=p?p.gd:0;});
    teams.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
    html+=`<div class="stg-group"><h3>${g}组</h3><table class="stg-table"><thead><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>GF</th><th>GA</th><th>GD</th><th>分</th></tr></thead><tbody>`;
    teams.forEach((t,i)=>{
      const played=GM.filter(m=>m[6]===g&&(teamKey(m[4])===t.name||teamKey(m[5])===t.name)&&!!getResult(m[0])).length;
      const wins=Math.floor((t.pts-(played*3-t.pts))/2)||0; // estimate for now
      let cls='';if(i<2)cls='adv';else if(i===2)cls='adv3';
      html+=`<tr class="${cls}"><td>${i+1}</td><td class="tname">${t.flag} ${t.name} <span style="font-size:.65rem;color:var(--muted)">#${RANKINGS[t.name]||'-'}</span></td><td>${played}</td><td>--</td><td>--</td><td>--</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gd}</td><td><b>${t.pts}</b></td></tr>`;
    });
    html+='</tbody></table></div>';
  });
  document.getElementById('stgContainer').innerHTML=html||'<p style="color:var(--muted);text-align:center;padding:40px">暂无积分数据，比赛开始后将自动更新</p>';
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('[id^="tab-"]').forEach(d=>d.style.display='none');
  const el=document.getElementById('tab-'+tab);
  if(el)el.style.display='';
  const map={groups:'小组赛',knockout:'淘汰赛',standings:'积分榜',bracket:'对阵图',players:'球员',stadiums:'场馆',all:'全部比赛'};
  const btn=[...document.querySelectorAll('.tab-btn')].find(b=>b.textContent.includes(map[tab]));
  if(btn)btn.classList.add('active');
  if(tab==='players'){renderPlayerGroupSelector('');renderPlayers();}
  if(tab==='standings')renderStandings();
  if(tab==='bracket')renderBracket();
  document.getElementById('searchInput').style.display=(tab==='standings'||tab==='bracket')?'none':'';
  applyFilters();
}

renderFavBar();renderPlayerGroupSelector('');renderPlayers();
applyFilters();
updateCountdown();
</script>
