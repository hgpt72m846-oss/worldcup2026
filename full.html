const ALL_MATCHES={};
function matchToDate(m){const[_,mo,da]=m[1].match(/(\d+)\.(\d+)/)||[];if(!mo)return null;const[hr,mi]=m[2].split(':').map(Number);return new Date(2026,parseInt(mo)-1,parseInt(da),hr,mi);}
function updateProgress(){const played=Object.keys(RESULTS).length;document.getElementById('progressFill').style.width=(played/104*100)+'%';document.getElementById('progressLabel').textContent=played+'/104 场已赛';document.getElementById('progressPct').textContent=Math.round(played/104*100)+'%';}
function buildCard(m,isKO){
  const[mn,date,bj,local,t1,t2,g,rnd,skey]=m,s=S(skey),isOpener=(mn==='M1'),isFinal=(rnd==='决赛');
  let cls='match-card';if(isFinal)cls+=' final-match';else if(isOpener)cls+=' opener';else if(m.length>9&&m[9])cls+=' hl';
  const rl=isKO?rnd:`${g}组 · ${rnd}`,gCls=isKO?'g-KO':'g-'+g,time=tz==='bj'?bj:local;
  const res=GR(mn),hasRes=!!res;
  const scoreHTML=hasRes?`<div class="score">${res.t1s} - ${res.t2s}</div>`:'';
  const ds=`${mn} ${t1} ${t2} ${g} ${rnd} ${s.city} ${s.name} ${date}`;
  ALL_MATCHES[mn]={m:m,isKO:isKO};
  const matchDate=matchToDate(m);const now=new Date();let status='';if(hasRes)status='done';else if(matchDate&&matchDate<=now)status='live';else status='upcoming';
  return`<div class="${cls}${hasRes?' has-result':''}${hasRes?' played':''}" data-search="${ds}" data-gr="${g}" data-rnd="${rnd}" data-date="${date}" onclick="openMatchDetail('${mn}')" title="点击查看详情"><div class="mtop"><span class="gnum">${mn}</span><span class="gbadge ${gCls}">${rl}</span><span class="gnum">${date}</span></div><div class="teams">${t1}<span class="vs">VS</span>${t2}</div>${scoreHTML}<div class="minfo"><span>🕐${time}</span><span>🏟️${s.name}</span><span>👥${s.cap}</span><span>🌿${s.surf}</span></div><div class="status-dot ${status}"></div></div>`;
}

function openMatchDetail(mn){
  const data=ALL_MATCHES[mn];if(!data)return;
  const{m,isKO}=data;
  const[_,date,bj,local,t1,t2,g,rnd,skey]=m;
  const s=S(skey),note=isKO&&m.length>7?m[7]:'';
  const k1=tk(t1),k2=tk(t2);
  function fr(tn){for(const key of Object.keys(P)){if(key===tn||key.includes(tn)||tn.includes(key))return P[key];}return[];}
  function gti(tn){for(const key of Object.keys(TEAMS_D)){if(key===tn||key.includes(tn)||tn.includes(key))return TEAMS_D[key];}return null;}
  const r1=fr(k1),r2=fr(k2),ti1=gti(k1),ti2=gti(k2);
  const res=GR(mn);
  const r1k=RANKINGS[k1]||'-',r2k=RANKINGS[k2]||'-';
  const resultHTML=res?`<div style="text-align:center;font-size:2rem;font-weight:800;color:var(--accent);margin:12px 0">${res.t1s} - ${res.t2s}${res.notes?'<span style="font-size:.8rem;color:var(--muted)"> ('+res.notes+')</span>':''}</div>`:'';

  function renderRosterByPos(label,roster){
    if(!roster||!roster.length)return`<div class="roster-side"><h5>${label}</h5><p style="font-size:.72rem;color:var(--muted)">暂无球员数据</p></div>`;
    const posOrder=['GK','DF','MF','FW'];const byPos={};posOrder.forEach(p=>byPos[p]=[]);
    roster.forEach(p=>{const pos=p[1];if(byPos[pos])byPos[pos].push(p);else byPos.GK.push(p);});
    let html=`<div class="roster-side"><h5>${label}</h5>`;
    posOrder.forEach(pos=>{if(!byPos[pos].length)return;html+=`<div class="roster-pos"><div class="pos-h">${pos==='GK'?'🧤 门将':pos==='DF'?'🛡️ 后卫':pos==='MF'?'🎯 中场':'⚽ 前锋'} (${byPos[pos].length}人)</div><div class="roster-grid">`;byPos[pos].forEach(p=>{const[nm,po,club,num,isCap]=p;html+=`<div class="roster-row${isCap?' cap':''}"><span class="rnum">${num}</span><span class="rname">${nm}${isCap?' ⭐':''}</span><span class="rclub">${club}</span></div>`;});html+='</div></div>';});
    html+='</div>';return html;
  }

  const editHTML=`<div class="result-edit"><input type="number" id="rs1_${mn}" placeholder="?" style="width:42px"><span>-</span><input type="number" id="rs2_${mn}" placeholder="?" style="width:42px"><input type="text" id="rsn_${mn}" placeholder="备注(可选)" style="width:90px"><button class="btn-sm" onclick="saveResult('${mn}')">💾 保存比分</button></div>`;

  const html=`<button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="m-title">${t1} VS ${t2}</div>
    <div class="m-sub">${isKO?rnd:g+'组 · '+rnd} | ${mn} | ${date} 北京时间 ${bj} | 当地 time ${local||'待定'}</div>
    ${resultHTML}
    <div class="m-section"><h4>📋 比赛配置信息</h4>
      <div class="m-config">
        <span>🇨🇳 北京 time：${date} ${bj}</span><span>📍 当地 time：${local||'待定'}</span>
        <span>🏟️ 比赛场馆：${s.name}</span><span>🏙️ 所在城市：${s.city} ${s.country}</span>
        <span>🕐 时区：${s.tz}</span><span>👥 球场容量：${s.cap} 座</span>
        <span>🌿 草皮类型：${s.surf}</span><span>🏗️ 屋顶结构：${s.roof}</span>
        <span>📅 建成时间：${s.open}</span><span>📊 FIFA排名：#${r1k} vs #${r2k}</span>
        ${ti1?`<span>👔 ${k1} 主教练：${ti1.mgr}</span>`:''}${ti2?`<span>👔 ${k2} 主教练：${ti2.mgr}</span>`:''}
        ${ti1?`<span>⭐ ${k1} 队长：${ti1.cap}</span>`:''}${ti2?`<span>⭐ ${k2} 队长：${ti2.cap}</span>`:''}
        ${s.note?`<span>📌 ${s.note}</span>`:''}${note?`<span>📌 ${note}</span>`:''}
      </div>
    </div>
    <div class="m-section"><h4>👥 双方球员完整名单（按位置分组）</h4>
      <div class="roster-dual">
        ${renderRosterByPos(t1,r1)}
        ${renderRosterByPos(t2,r2)}
      </div>
    </div>
    ${editHTML}`;

  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');document.body.style.overflow='';}

function renderStandings(){
  const groups={};'ABCDEFGHIJKL'.split('').forEach(g=>{groups[g]=[];});
  GM.forEach(m=>{const g=m[6],t1=tk(m[4]),t2=tk(m[5]);if(!groups[g])return;if(!groups[g].find(t=>t.name===t1))groups[g].push({name:t1,flag:m[4]});if(!groups[g].find(t=>t.name===t2))groups[g].push({name:t2,flag:m[5]});});
  const pts={};
  Object.entries(RESULTS).forEach(([mn,res])=>{const m=[...GM,...KO].find(x=>x[0]===mn);if(!m||(m[7]&&m[7].includes('决赛')))return;const t1=tk(m[4]),t2=tk(m[5]);if(!pts[t1])pts[t1]={p:0,gf:0,ga:0};if(!pts[t2])pts[t2]={p:0,gf:0,ga:0};pts[t1].gf+=res.t1s;pts[t1].ga+=res.t2s;pts[t2].gf+=res.t2s;pts[t2].ga+=res.t1s;if(res.t1s>res.t2s)pts[t1].p+=3;else if(res.t1s<res.t2s)pts[t2].p+=3;else{pts[t1].p+=1;pts[t2].p+=1;}});
  let html='';
  Object.keys(groups).sort().forEach(g=>{const teams=groups[g];teams.forEach(t=>{const p=pts[t.name];t.pts=p?p.p:0;t.gf=p?p.gf:0;t.ga=p?p.ga:0;t.gd=t.gf-t.ga;});teams.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);html+=`<div class="standings-group"><h3>${g}组</h3><table class="stg-table"><thead><tr><th>#</th><th>球队</th><th>赛</th><th>分</th><th>GF</th><th>GA</th><th>GD</th></tr></thead><tbody>`;teams.forEach((t,i)=>{let cls='';if(i<2)cls='adv';else if(i===2)cls='adv3';html+=`<tr class="${cls}"><td>${i+1}</td><td class="tname">${t.flag} ${t.name} <span style="font-size:.63rem;color:var(--muted)">#${RANKINGS[t.name]||'-'}</span></td><td>0</td><td><b>${t.pts}</b></td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gd}</td></tr>`;});html+='</tbody></table></div>';});
  document.getElementById('stgContainer').innerHTML=html||'<p style="color:var(--muted);text-align:center;padding:40px">暂无积分数据，比赛开始后将自动更新</p>';
}

function renderPlayerGroupSelector(fg){const c=document.getElementById('playerGroupSelector');let h='';'ABCDEFGHIJKL'.split('').forEach(g=>h+=`<span class="ps-chip${fg===g?' active':''}" onclick="FPG('${fg===g?'':g}')">${g}组</span>`);h+=`<span class="ps-chip${!fg?' active':''}" onclick="FPG('')">全部</span>`;c.innerHTML=h;const sel=document.getElementById('playerTeamFilter');sel.innerHTML='<option value="">全部球队</option>';Object.keys(P).sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});}
function FPG(g){pGroup=g;document.getElementById('playerTeamFilter').value='';renderPlayerGroupSelector(g);RP();}
function RP(){
  const search=document.getElementById('playerSearch').value.toLowerCase().trim(),team=document.getElementById('playerTeamFilter').value;
  let html='',total=0;
  Object.keys(P).sort().forEach(t=>{const roster=P[t];if(!roster.length)return;const info=TEAMS_D[t];if(!info)return;if(pGroup&&info.g!==pGroup)return;if(team&&t!==team)return;let f=roster;if(search)f=roster.filter(p=>p[0].includes(search)||p[2].includes(search));if(!f.length)return;html+=`<div style="margin-bottom:16px"><div class="player-team-title">${t}</div><div class="player-team-meta">${info.g}组 | 👔${info.mgr} | ⭐${info.cap} | FIFA #${RANKINGS[t]||'-'}</div><div class="player-grid">`;f.forEach(p=>{const[nm,pos,club,num,isCap]=p;html+=`<div class="player-card${isCap?' captain':''}"><span class="pnum">${num}</span><div class="pinfo"><div class="pname">${nm}${isCap?' ⭐':''}</div><div class="pdetail"><span class="ppos">${pos}</span>${club}</div></div></div>`;});html+='</div></div>';total+=f.length;});
  document.getElementById('playerRoster').innerHTML=html||'<div class="no-results">👤 没有匹配的球员</div>';document.getElementById('playerCount').textContent=`共 ${total} 人`;
}
function renderFavs(){const teams=[...new Set(GM.map(m=>tk(m[4])))].sort();let h='';teams.forEach(t=>{h+=`<span class="fav-chip${fav.includes(t)?' active':''}" onclick="toggleFav('${t}')">⭐${t}</span>`;});document.getElementById('favBar').innerHTML=h;}
function toggleFav(t){if(fav.includes(t))fav=fav.filter(x=>x!==t);else fav.push(t);localStorage.setItem('wc2026_favs',JSON.stringify(fav));renderFavs();renderTab();}
function favFilter(m){if(!fav.length)return true;return fav.includes(tk(m[4]))||fav.includes(tk(m[5]));}

// ═══════════════════════════════ FILTERS ═══════════════════════════════
function populateFilters(){
  const dates=new Set(),cities=new Set();
  [...GM,...KO].forEach(m=>{dates.add(m[1]);cities.add(S(m[8]||m[6]).city);});
  const ds=document.getElementById('dateFilter');[...dates].sort().forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;ds.appendChild(o);});
  const cs=document.getElementById('cityFilter');[...cities].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);});
  const rs=document.getElementById('roundFilter');['第1轮','第2轮','第3轮','1/16决赛','1/8决赛','1/4决赛','半决赛','三四名决赛','决赛'].forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;rs.appendChild(o);});
  const gs=document.getElementById('groupFilter');'ABCDEFGHIJKL'.split('').forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g+'组';gs.appendChild(o);});
}
function switchTZ(v){tz=v;renderTab();}
function AF(){
  const search=document.getElementById('searchInput').value.toLowerCase().trim(),g=document.getElementById('groupFilter').value,d=document.getElementById('dateFilter').value,r=document.getElementById('roundFilter').value,c=document.getElementById('cityFilter').value;
  let n=0;
  document.querySelectorAll('.match-card').forEach(card=>{const ds=(card.getAttribute('data-search')||'').toLowerCase();let show=true;if(search&&!ds.includes(search))show=false;if(g&&!ds.includes(g))show=false;if(d&&!ds.includes(d))show=false;if(r&&!ds.includes(r))show=false;if(c&&!ds.includes(c))show=false;card.style.display=show?'':'none';if(show)n++;});
  document.getElementById('resultCount').textContent=`共 ${n} 场`;
  document.getElementById('noResults').style.display=n===0?'':'none';
}
function RF(){document.getElementById('searchInput').value='';document.getElementById('groupFilter').value='';document.getElementById('dateFilter').value='';document.getElementById('roundFilter').value='';document.getElementById('cityFilter').value='';AF();}

// ═══════════════════════════════ TABS ═══════════════════════════════
function ST(tab){
  ctab=tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('[id^="tab-"]').forEach(d=>d.style.display='none');
  const el=document.getElementById('tab-'+tab);if(el)el.style.display='';
  const map={groups:'小组赛',knockout:'淘汰赛',standings:'积分榜',bracket:'对阵图',players:'球员',stadiums:'场馆',all:'全部比赛'};
  const btn=[...document.querySelectorAll('.tab-btn')].find(b=>b.textContent.includes(map[tab]));if(btn)btn.classList.add('active');
  if(tab==='groups')renderGroups();else if(tab==='knockout')renderKO();else if(tab==='standings')renderStandings();else if(tab==='bracket')renderBracket();else if(tab==='players'){renderPlayerGroupSelector('');RP();}else if(tab==='stadiums')renderStadiums();else if(tab==='all')renderAll();
  AF();
}
function renderTab(){if(ctab==='groups')renderGroups();else if(ctab==='knockout')renderKO();else if(ctab==='all')renderAll();else if(ctab==='standings')renderStandings();else if(ctab==='bracket')renderBracket();}

// ═══════════════════════════════ INIT ═══════════════════════════════
// ═══ Live scores ═══
const ES={墨西哥:'Mexico',南非:'South Africa',韩国:'South Korea',捷克:'Czechia',加拿大:'Canada',波黑:'Bosnia & Herzegovina',卡塔尔:'Qatar',瑞士:'Switzerland',巴西:'Brazil',摩洛哥:'Morocco',海地:'Haiti',苏格兰:'Scotland',美国:'United States',巴拉圭:'Paraguay',澳大利亚:'Australia',土耳其:'Turkey',德国:'Germany',库拉索:'Curaçao',科特迪瓦:'Ivory Coast',厄瓜多尔:'Ecuador',荷兰:'Netherlands',日本:'Japan',瑞典:'Sweden',突尼斯:'Tunisia',西班牙:'Spain',佛得角:'Cape Verde',沙特:'Saudi Arabia',乌拉圭:'Uruguay',比利时:'Belgium',埃及:'Egypt',伊朗:'Iran',新西兰:'New Zealand',法国:'France',塞内加尔:'Senegal',伊拉克:'Iraq',挪威:'Norway',阿根廷:'Argentina',阿尔及利亚:'Algeria',奥地利:'Austria',约旦:'Jordan',葡萄牙:'Portugal',民主刚果:'DR Congo',哥伦比亚:'Colombia',英格兰:'England',克罗地亚:'Croatia',加纳:'Ghana',巴拿马:'Panama',乌兹别克:'Uzbekistan'};
function fetchLiveScores(){
  fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard')
    .then(r=>r.json()).then(data=>{
      let updated=0;
      (data.events||[]).forEach(e=>{
        const c=e.competitions[0];if(!c||c.competitors.length<2)return;
        const t1en=c.competitors[0].team.displayName;
        const t2en=c.competitors[1].team.displayName;
        const s1=parseInt(c.competitors[0].score||0);
        const s2=parseInt(c.competitors[1].score||0);
        if(e.status.type.state==='pre')return;
        const t1cn=Object.keys(ES).find(k=>ES[k]===t1en)||'';
        const t2cn=Object.keys(ES).find(k=>ES[k]===t2en)||'';
        if(!t1cn||!t2cn)return;
        for(const key of Object.keys(ALL_MATCHES)){
          const m=ALL_MATCHES[key].m;const tn1=tk(m[4]),tn2=tk(m[5]);
          if((tn1===t1cn&&tn2===t2cn)||(tn1===t2cn&&tn2===t1cn)){
            if(!RESULTS[key]||RESULTS[key].t1s!==s1||RESULTS[key].t2s!==s2){
              RESULTS[key]={t1s:s1,t2s:s2,notes:''};SR();updated++;
            }
          }
        }
      });
      if(updated>0){updateProgress();renderTab();}
    }).catch(()=>{});
}
setInterval(fetchLiveScores,30000);setTimeout(fetchLiveScores,2000);

populateFilters();renderGroups();renderKO();renderAll();renderStandings();renderBracket();renderStadiums();renderFavs();renderPlayerGroupSelector('');RP();updateCD();updateProgress();
</script>
